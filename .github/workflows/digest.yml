# Robô de redação + site: a cada 3 horas baixa os feeds, gera o digest com IA,
# monta o site (mesmo código do app) e publica tudo no GitHub Pages. Custo zero.
# Configurar: Settings > Secrets > Actions > GROQ_API_KEY (e opcional NVIDIA_API_KEY),
# e Settings > Pages > Source: GitHub Actions.
name: digest

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # análises do Stockfish de execuções anteriores (scripts/games.mjs): a chave muda a cada execução
      # para o cache ser regravado no fim; restore-keys pega o mais recente
      - uses: actions/cache@v4
        with:
          path: .cache
          key: engine-${{ github.run_id }}
          restore-keys: engine-
      # restaura o digest anterior para só traduzir itens novos. Baixa num arquivo à parte e só troca
      # se o JSON estiver inteiro: download cortado não pode derrubar o robô nem o build do site
      - run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/digest.json" -o /tmp/prev-digest.json \
            && node -e "JSON.parse(require('fs').readFileSync('/tmp/prev-digest.json', 'utf8'))" \
            && mv /tmp/prev-digest.json src/data/digest.json || true
      # o arquivo de edições se acumula no próprio site: restaura o publicado (mesma proteção)
      - run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/arquivo.json" -o /tmp/prev-arquivo.json \
            && node -e "JSON.parse(require('fs').readFileSync('/tmp/prev-arquivo.json', 'utf8'))" \
            && mv /tmp/prev-arquivo.json src/data/arquivo.json || true
      # sem chave ou com a IA fora do ar, o site sai mesmo assim com o último digest
      # teto de segurança: o robô já se limita a ~12 min de texto; se algo travar, aos 20 min o site
      # sai com o que ele já gravou (checkpoints) ou com o digest anterior
      - run: node scripts/digest.mjs
        continue-on-error: true
        timeout-minutes: 20
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # soma a edição de hoje ao arquivo (falha aqui não segura o site)
      - run: node scripts/archive.mjs
        continue-on-error: true
      # site: exporta o app para web já com o digest novo embutido
      - run: npx expo export -p web
      # publica o digest mais novo que houver: com o robô ok, é igual ao docs/digest.json; se ele
      # falhou, sai o restaurado ou o do último checkpoint, nunca a cópia antiga do repositório
      - run: |
          cp src/data/digest.json docs/digest.json
          # o arquivo sai do que a execução tem (novo ou restaurado): histórico nunca some por falha
          if [ -f src/data/arquivo.json ]; then cp src/data/arquivo.json docs/arquivo.json; fi
          cp docs/* dist/
      # prévia do link (WhatsApp, Telegram, X, Google) e página de reserva para links diretos
      - run: node scripts/seo.mjs && cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
